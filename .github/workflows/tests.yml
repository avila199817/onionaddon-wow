name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lua 5.1 syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (the WoW client's Lua version)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1

      - name: Syntax check
        run: |
          for file in OnionDebug/*.lua tests/*.lua; do
            luac5.1 -p "$file"
          done

      - name: Run tests
        run: lua5.1 tests/run_tests.lua
